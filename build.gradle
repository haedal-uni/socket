plugins {
    id 'org.springframework.boot' version '3.0.1'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id "me.champeau.jmh" version "0.6.4"
}

group = 'com.dalcho'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.projectlombok:lombok:1.18.20'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2:1.4.199'
    runtimeOnly 'mysql:mysql-connector-java'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // chat
    implementation 'org.webjars:webjars-locator-core' // version
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.webjars:sockjs-client:1.1.2'
    implementation 'org.webjars:stomp-websocket:2.3.3-1'
    implementation 'org.webjars.bower:bootstrap:4.3.1'
    implementation 'org.webjars:jquery:3.7.1'

    // chat-file
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.apache.commons:commons-lang3' //StringUtils

    // securtiy
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt:0.9.1' // jwt
    //implementation 'org.json:json:20220320'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    // 소셜 로그인을 통한 인증과 권한 처리를 쉽게 할 수 있게 해준다.

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    //implementation 'redis.clients:jedis:3.6.3' // RedisSubscriber
    //implementation 'org.springframework.boot:spring-boot-starter-reactor-netty'//broker
    //implementation 'org.springframework.session:spring-session-data-redis'

    // 메시지 큐
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    //file
    //implementation 'commons-io:commons-io:2.11.0'

    //test
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core:3.23.1'

    // JMH
    implementation 'org.openjdk.jmh:jmh-core:1.32'
    implementation 'org.openjdk.jmh:jmh-generator-annprocess:1.32'

    implementation 'org.slf4j:slf4j-simple:1.7.36'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // javax.xml.bind
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'

    // webflux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'


    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'io.micrometer:micrometer-registry-prometheus' // prometheus 추가
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}
jmh{
    fork = 2                // 벤치마크마다 별도 JVM으로 격리
    warmupIterations = 10
    iterations = 10
    // ms급 작업을 1s iteration으로 재면 iteration당 호출이 150회 수준이라
    // OS 스케줄러·디스크 노이즈가 그대로 점수에 찍힌다. iteration을 늘려 편차를 줄인다.
    warmup = '2s'           // iteration당 시간
    timeOnIteration = '3s'
    // 문서(JMH.md / 이력서-포트폴리오.md)에 들어가는 수치는 모두 한 run에서 뽑는다.
    // → 기본은 전체 실행. 일부만 돌리면 문서 안에서 run이 섞인다.
    // 특정 벤치마크만 돌릴 때만 아래를 켠다.
    // (클래스명을 여러 개 나열하면 매칭이 안 되므로 정규식 하나로 묶어야 한다)
    // includes = ['.*(ChatOpenBenchmark|LastLineBenchmark|RedisCache).*']
}
test {
    useJUnitPlatform()
}
